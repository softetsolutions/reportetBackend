  /api/headQuarter/getAllHeadQuarterNames:
    get:
      tags: [HeadQuarter]
      summary: Headquarter name options
      responses:
        "200":
          description: Names

  /api/headQuarter/employee:
    post:
      tags: [HeadQuarter]
      summary: Headquarters assigned to the employee
      responses:
        "200":
          description: Headquarters

  /api/headQuarter/import:
    post:
      tags: [HeadQuarter]
      summary: Import headquarters from Excel
      responses:
        "200":
          description: Import result

  /api/headQuarter/unassigned:
    get:
      tags: [HeadQuarter]
      summary: Unassigned hierarchy
      responses:
        "200":
          description: Unassigned nodes

  /api/headQuarter/zones:
    get:
      tags: [HeadQuarter]
      summary: Zone names for the org
      responses:
        "200":
          description: Zones

  /api/headQuarter/{headquarterId}:
    put:
      tags: [HeadQuarter]
      summary: Edit headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [HeadQuarter]
      summary: Delete headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/headQuarter/{headquarterId}/assignments:
    get:
      tags: [HeadQuarter]
      summary: Assignments for a headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
