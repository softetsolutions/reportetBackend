                    enum: [not_started, active, completed]
                  date: { type: string, example: "2026-09-12" }
        "403":
          description: Not an employee token

  /api/tracking/start:
    post:
      tags: [Tracking]
      summary: Start today's MR tracking session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude]
              properties:
                latitude: { type: number }
                longitude: { type: number }
      responses:
        "201":
          description: Started
        "200":
          description: Session already active
        "400":
          description: Missing coordinates
        "403":
          description: Tracking disabled or not MR
        "409":
          description: Today already completed

  /api/tracking/ping:
    post:
      tags: [Tracking]
      summary: Batch GPS pings (rate limit 30/min)
      description: Accepts a single point or `{ points: PingPoint[] }` (1-200).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: array
                  items:
                    $ref: "#/components/schemas/TrackingPingPoint"
                latitude: { type: number }
                longitude: { type: number }
                accuracy: { type: number }
                speed: { type: number }
                heading: { type: number }
                battery: { type: number }
                activity:
                  type: string
                  enum: [still, walking, driving, unknown]
                timestamp: { type: string, format: date-time }
      responses:
        "201":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  accepted: { type: integer }
                  rejected: { type: integer }
        "400":
          description: Invalid payload
        "403":
          description: Tracking disabled
        "409":
          description: No active session

  /api/tracking/end:
    post:
      tags: [Tracking]
      summary: End today's MR tracking session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude: { type: number }
                longitude: { type: number }
      responses:
        "200":
          description: Ended
        "404":
          description: No active session

  /api/tracking/trip/today:
    get:
      tags: [Tracking]
      summary: Today's trip summary
      description: Employee sees own trip. Org must pass employeeId.
      parameters:
        - in: query
          name: employeeId
          schema: { type: string }
          description: Required for org tokens
      responses:
        "200":
          description: Trip status for today
        "400":
          description: employeeId required for org

  /api/tracking/live:
    get:
      tags: [Tracking]
      summary: SSE stream of all live MR locations
      description: Org JWT via Authorization header or `?token=` for EventSource.
      parameters:
        - in: query
          name: token
          schema: { type: string }
          description: Optional JWT for EventSource clients
      responses:
        "200":
          description: text/event-stream (snapshot, mr:started, mr:location, mr:ended)

  /api/tracking/live/{employeeId}:
    get:
      tags: [Tracking]
      summary: SSE stream for one employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: token
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream

  /api/tracking/trips:
    get:
      tags: [Tracking]
      summary: List trips for an employee (date range)
      parameters:
        - in: query
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, example: "2026-09-01" }
        - in: query
          name: to
          schema: { type: string, example: "2026-09-12" }
      responses:
        "200":
          description: Trip list
        "400":
          description: Invalid params
        "404":
          description: Employee not found

  /api/tracking/trip:
    get:
      tags: [Tracking]
      summary: Trip analysis for employee + date (path, timeline, markers)
      parameters:
        - in: query
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string, example: "2026-09-12" }
      responses:
        "200":
          description: Trip analysis payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingTripAnalysis"
        "400":
          description: Invalid params
        "404":
          description: Trip or employee not found

  /api/tracking/trip/raw:
    get:
      tags: [Tracking]
      summary: Raw GPS points for a trip day
      parameters:
        - in: query
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: date
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Raw points
        "404":
          description: Trip not found

  /api/tracking/employees:
    get:
      tags: [Tracking]
      summary: Tracking employee directory
      responses:
        "200":
          description: Employees with tracking flags and online status

  /api/tracking/org/enable:
    post:
      tags: [Tracking]
      summary: Enable live tracking for the organization
      responses:
        "200":
          description: Enabled

  /api/tracking/org/disable:
    post:
      tags: [Tracking]
      summary: Disable live tracking for the organization
      responses:
        "200":
          description: Disabled

  /api/tracking/employees/{employeeId}/tracking/enable:
    post:
      tags: [Tracking]
      summary: Enable live tracking for one employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Enabled
        "404":
          description: Employee not found

  /api/tracking/employees/{employeeId}/tracking/disable:
    post:
      tags: [Tracking]
      summary: Disable live tracking for one employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Disabled
        "404":
          description: Employee not found

  /api/payroll/settings:
    get:
      tags: [Payroll]
      summary: Get org payroll settings (weekly offs, LOP divisor)
      description: |
        Org admin only. Defaults created on first access — weeklyOffWeekdays `[0]` (Sunday),
        lopDivisorMethod `calendar_days`.
      responses:
        "200":
          description: Settings
    patch:
      tags: [Payroll]
      summary: Update payroll settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                weeklyOffWeekdays:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: "0=Sunday … 6=Saturday"
                lopDivisorMethod:
                  type: string
                  enum: [calendar_days, working_days]
                payslipTemplate:
                  type: string
                  enum: [classic, modern, compact]
                  description: Default salary slip skin for employee mobile/pdf-lib
      responses:
        "200":
          description: Updated

  /api/payroll/me/payslips:
    get:
      tags: [Payroll]
      summary: List my finalized salary slips (employee token)
      description: |
        Employee JWT only. Returns finalized payslips for the logged-in employee.
        Draft / onHold slips are never listed.
      parameters:
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: Payslip list for mobile home screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  payslips:
                    type: array
                    items:
                      type: object
                      properties:
                        payslipId: { type: string }
                        month: { type: integer }
                        year: { type: integer }
                        periodLabel: { type: string, example: "April 2026" }
                        currency: { type: string }
                        gross: { type: number }
                        netPay: { type: number }
                        lopDays: { type: number }
                        lopAmount: { type: number }
                        status: { type: string, example: finalized }
        "401":
          description: Unauthorized

  /api/payroll/me/payslips/{payslipId}:
    get:
      tags: [Payroll]
      summary: Salary slip layout + data for view and pdf-lib download
      description: |
        Employee JWT. Returns `templateId`, `layout` (sections/theme for pdf-lib),
        and `data` (org branding, earnings, deductions, LOP, net, bank masked).
        Mobile renders on screen and builds PDF locally — backend does not return a PDF file.
        Optional `templateId` query overrides org default (`classic`|`modern`|`compact`).
      parameters:
        - in: path
          name: payslipId
          required: true
          schema: { type: string }
        - in: query
          name: templateId
          schema:
            type: string
            enum: [classic, modern, compact]
      responses:
        "200":
          description: Layout + data payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  templateId: { type: string }
                  layout: { type: object }
                  data: { type: object }
                  availableTemplates:
                    type: array
                    items: { type: object }
        "403":
          description: Slip not finalized / not available
        "404":
          description: Not found

  /api/payroll/payslip-templates:
    get:
      tags: [Payroll]
      summary: List available payslip template metadata
      description: Employee or org token
      responses:
        "200":
          description: Templates classic / modern / compact

  /api/payroll/holidays:
    get:
      tags: [Payroll]
      summary: List org holidays
      parameters:
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: Holidays
    post:
      tags: [Payroll]
      summary: Create or update a single holiday by date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, example: "2026-01-26" }
                name: { type: string, example: Republic Day }
      responses:
        "200":
          description: Saved

  /api/payroll/holidays/template:
    get:
      tags: [Payroll]
      summary: Download Excel template for bulk holiday upload
      responses:
        "200":
          description: holiday-template.xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }

  /api/payroll/holidays/import:
    post:
      tags: [Payroll]
      summary: Bulk upload holidays from Excel
      description: |
        Multipart form-data. Field `file` = .xlsx with columns Date, Name.
        Optional `overwrite` (default true). Set overwrite=false to skip existing dates.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                overwrite: { type: string, example: "true" }
      responses:
        "200":
          description: Import result with created/updated/skipped/errors

  /api/payroll/holidays/bulk:
    post:
      tags: [Payroll]
      summary: Bulk create/update holidays via JSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holidays]
              properties:
                overwrite: { type: boolean, default: true }
                holidays:
                  type: array
                  items:
                    type: object
                    required: [date, name]
                    properties:
                      date: { type: string }
                      name: { type: string }
      responses:
        "200":
          description: Bulk save result

  /api/payroll/holidays/copy-year:
    post:
      tags: [Payroll]
      summary: Clone holidays from one year to another
      description: |
        Copies MM-DD from fromYear into toYear. Warns that movable festivals
        (Diwali, Holi, Eid) must be reviewed after copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromYear, toYear]
              properties:
                fromYear: { type: integer, example: 2025 }
                toYear: { type: integer, example: 2026 }
                overwrite: { type: boolean, default: false }
      responses:
        "200":
          description: Copy result
        "404":
          description: No source holidays for fromYear

  /api/payroll/holidays/presets:
    get:
      tags: [Payroll]
      summary: List available holiday country packs
      responses:
        "200":
          description: Preset metadata (india_national)

  /api/payroll/holidays/presets/preview:
    get:
      tags: [Payroll]
      summary: Preview India preset holidays for a year (no write)
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: packId
          schema: { type: string, default: india_national }
      responses:
        "200":
          description: Holiday list that would be applied

  /api/payroll/holidays/presets/apply:
    post:
      tags: [Payroll]
      summary: Apply India national/common holiday preset for a year
      description: |
        Seeds fixed national holidays + common dates. Full festival packs exist for
        2025–2027; other years get fixed-date holidays only. Always review after apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year]
              properties:
                year: { type: integer, example: 2026 }
                packId: { type: string, default: india_national }
                overwrite: { type: boolean, default: false }
      responses:
        "200":
          description: Apply result

  /api/payroll/holidays/{holidayId}:
    delete:
      tags: [Payroll]
      summary: Delete a holiday
      parameters:
        - in: path
          name: holidayId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/payroll/employees/{employeeId}/bank-details:
    get:
      tags: [Payroll]
      summary: Get employee bank details
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bank details or null
    put:
      tags: [Payroll]
      summary: Upsert employee bank details
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountHolderName, accountNumber, ifsc]
              properties:
                accountHolderName: { type: string }
                accountNumber: { type: string }
                ifsc: { type: string }
                bankName: { type: string }
                accountType: { type: string, enum: [savings, current] }
      responses:
        "200":
          description: Saved

  /api/payroll/employees/{employeeId}/salary-structures:
    get:
      tags: [Payroll]
      summary: List salary structure versions for employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Structures newest first
    post:
      tags: [Payroll]
      summary: Create a new salary structure version
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom, earnings]
              properties:
                effectiveFrom: { type: string, format: date }
                currency: { type: string, example: INR }
                earnings:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      label: { type: string }
                      amount: { type: number }
                deductions:
                  type: array
                  items:
                    type: object
                    properties:
                      code: { type: string }
                      label: { type: string }
                      amount: { type: number }
      responses:
        "201":
          description: Created

  /api/payroll/employees/{employeeId}/salary-structures/current:
    get:
      tags: [Payroll]
      summary: Current salary structure as of a date
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: asOf
          schema: { type: string, format: date }
      responses:
        "200":
          description: Structure or null

  /api/payroll/runs:
    get:
      tags: [Payroll]
      summary: List payroll runs
      responses:
        "200":
          description: Runs
    post:
      tags: [Payroll]
      summary: Create draft payroll run and generate payslips
      description: |
        For each active employee with a salary structure effective in the month:
        computes attendance from daily visits + approved leaves + weekly offs + holidays,
        suggests LOP, builds draft payslip. Employees without structure are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, year]
              properties:
                month: { type: integer, minimum: 1, maximum: 12 }
                year: { type: integer }
      responses:
        "201":
          description: Run created
        "409":
          description: Run already exists for month

  /api/payroll/runs/{runId}:
    get:
      tags: [Payroll]
      summary: Run detail with payslips and missing bank list
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Run + payslips

  /api/payroll/runs/{runId}/regenerate:
    post:
      tags: [Payroll]
      summary: Regenerate draft payslips (draft runs only)
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Regenerated
        "409":
          description: Run is finalized

  /api/payroll/runs/{runId}/finalize:
    post:
      tags: [Payroll]
      summary: Finalize run (locks draft payslips)
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Finalized

  /api/payroll/runs/{runId}/payslips/{payslipId}:
    get:
      tags: [Payroll]
      summary: Payslip detail for admin UI / print
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: payslipId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Payslip + org branding fields
    patch:
      tags: [Payroll]
      summary: Edit draft payslip (LOP waive/hold)
      description: |
        Set `finalLopDays` (e.g. 0 to waive all LOP). Set `status` to `onHold` or `draft`.
        Only on draft runs.
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
        - in: path
          name: payslipId
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                finalLopDays: { type: number }
                status: { type: string, enum: [draft, onHold] }
                holdReason: { type: string }
                adminNote: { type: string }
      responses:
        "200":
          description: Updated

  /api/payroll/runs/{runId}/export/bank-file:
    get:
      tags: [Payroll]
      summary: Download bank salary-credit CSV (finalized only)
      description: |
        Columns — Beneficiary Name, Account Number, IFSC, Amount, Payment Type, Narration,
        Employee Id, Employee Name. Skips on-hold / missing bank / zero net.
        Response headers `X-Bank-File-Rows`, `X-Bank-File-Skipped`, `X-Bank-File-Skipped-JSON`.
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "422":
          description: Run not finalized

  /api/payroll/runs/{runId}/export/payslips:
    get:
      tags: [Payroll]
      summary: Download payslips Excel summary
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Excel file

  /api/tour-plans/me/month:
    get:
      tags: [TourPlan]
      summary: Monthly tour plan calendar and saved day plans (MR)
      description: |
        Employee JWT (`typ: employee`). Returns working-day calendar (Sundays and org holidays
        are non-selectable), progress summary, `dayPlans` map for the whole month, and
        `dayPlan` for the selected date. Resolve labels via `GET /api/employee/getAssignedDetails`.
        On date tap, read `dayPlans[date]` locally — no extra API call.
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer, example: 2024 }
        - in: query
          name: month
          required: true
          schema: { type: integer, minimum: 1, maximum: 12, example: 10 }
        - in: query
          name: selectedDate
          required: false
          schema: { type: string, example: "2024-10-18" }
      responses:
        "200":
          description: Month view
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: "#/components/schemas/TourPlanMonthView"
        "422":
          description: Invalid year or month

  /api/tour-plans/me/day:
    get:
      tags: [TourPlan]
      summary: Tour plan for a single date (MR)
      description: |
        Returns planned `areaIds` and `doctorIds` for one date. Tour plan only — does not
        touch daily visit / reporting. Mobile uses this to prefill the reporting form when
        the user picks a date. Labels from GET /api/employee/getAssignedDetails.
      parameters:
        - in: query
          name: date
          required: true
          schema: { type: string, example: "2024-10-18" }
      responses:
        "200":
          description: Plan for the date (or empty if none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      date: { type: string, example: "2024-10-18" }
                      hasPlan: { type: boolean, example: true }
                      areaIds:
                        type: array
                        items: { type: string }
                      doctorIds:
                        type: array
                        items: { type: string }
        "422":
          description: Missing or invalid date

  /api/tour-plans/me/month/days:
    put:
      tags: [TourPlan]
      summary: Bulk save tour plan days for a month (MR)
      description: |
        Upserts one entry per date in `days[]`. Dates omitted from the array are unchanged.
        Each day requires both `areaIds` and `doctorIds` to mark planned, or empty arrays to clear.
        Returns full month view including `dayPlans`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month, days]
              properties:
                year: { type: integer, example: 2024 }
                month: { type: integer, example: 10 }
                selectedDate: { type: string, example: "2024-10-18" }
                days:
                  type: array
                  items:
                    type: object
                    required: [date, areaIds, doctorIds]
                    properties:
                      date: { type: string, example: "2024-10-18" }
                      areaIds:
                        type: array
                        items: { type: string }
                      doctorIds:
                        type: array
                        items: { type: string }
      responses:
        "200":
          description: Full month view with dayPlans
        "403":
          description: Month locked
        "422":
          description: Validation error

  /api/tour-plans/me/days/{date}:
    put:
      tags: [TourPlan]
      summary: Save one tour entry for a working day (MR)
      description: |
        Upserts exactly one plan per date. Send both `areaIds` and `doctorIds` to mark planned;
        send empty arrays for both to clear the day. Blocked when month status is submitted/approved.
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, example: "2024-10-18" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areaIds, doctorIds]
              properties:
                areaIds:
                  type: array
                  items: { type: string }
                doctorIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Full month view with dayPlans
        "403":
          description: Month locked (already submitted)
        "422":
          description: Non-working day, invalid ids, or partial area/doctor selection

  /api/tour-plans/me/copy-previous-month:
    post:
      tags: [TourPlan]
      summary: Copy previous month tour plan into the target month (MR)
      description: |
        Maps by day-of-month (e.g. Oct 5 ← Sep 5) onto target working days only.
        Skips non-working days and, by default, days that already have a plan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer, example: 2024 }
                month: { type: integer, example: 10 }
                overwrite: { type: boolean, default: false }
                selectedDate: { type: string, example: "2024-10-18" }
      responses:
        "200":
          description: Full month view with dayPlans plus copy stats
        "404":
          description: No plan in previous month

  /api/tour-plans/me/submit:
    post:
      tags: [TourPlan]
      summary: Submit monthly tour plan for approval (MR)
      description: |
        Sets status to `submitted`. Optional `days[]` saves then submits in one call.
        Partial months are allowed; response includes `validationWarnings` and full `dayPlans`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, month]
              properties:
                year: { type: integer, example: 2024 }
                month: { type: integer, example: 10 }
                selectedDate: { type: string, example: "2024-10-18" }
                days:
                  type: array
                  description: Optional — bulk save before submit
                  items:
                    type: object
                    required: [date, areaIds, doctorIds]
                    properties:
                      date: { type: string, example: "2024-10-18" }
                      areaIds:
                        type: array
                        items: { type: string }
                      doctorIds:
                        type: array
                        items: { type: string }
      responses:
        "200":
          description: Submitted with full month view
        "403":
          description: Already submitted

  /api/tour-plans/subordinates:
    get:
      tags: [TourPlan]
      summary: List subordinate tour plans (AM / ZM / org admin)
      description: |
        Paginated tour plans for all subordinates (org admin sees all employees).
        Filter by `status`, `year`, `month`, employee `role`, and `search` / `name`.
        Each row includes `employee.displayName` and `reportGroup` (`direct` | `other`).
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [draft, submitted, approved, rejected]
        - in: query
          name: year
          schema: { type: integer, example: 2024 }
        - in: query
          name: month
          schema: { type: integer, example: 10 }
        - in: query
          name: role
          schema:
            type: string
            enum: [mr, areaManager, zonalManager]
        - in: query
          name: search
          schema: { type: string, example: "Rahul" }
          description: Search by employee first name, last name, or employeeId
        - in: query
          name: name
          schema: { type: string }
          description: Alias for search
        - in: query
          name: pageNo
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10, maximum: 50, example: 10 }
      responses:
        "200":
          description: Paginated plans with directReports/otherReports for current page
        "422":
          description: Invalid role filter

  /api/tour-plans/subordinates/{planId}:
    get:
      tags: [TourPlan]
      summary: Full tour plan detail for approval review (AM / ZM / org admin)
      description: |
        Returns calendar, `days[]` (each day with populated `areas` and `doctors`),
        and `dayPlans` map keyed by date. Includes employee profile block.
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Full enriched month plan
        "403":
          description: Out of scope

  /api/tour-plans/{planId}/action:
    post:
      tags: [TourPlan]
      summary: Approve or reject a submitted tour plan (AM / ZM / org admin)
      description: |
        Same pattern as POST /api/leaves/{id}/action.
        `submitted` is the pending state. Reject requires `rejectionReason`.
      parameters:
        - in: path
          name: planId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approved, rejected]
                rejectionReason:
                  type: string
                  description: Required when action is rejected
      responses:
        "200":
          description: Updated plan
        "409":
          description: Plan is not in submitted state
        "403":
          description: Not authorized for this employee
