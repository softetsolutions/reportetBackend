openapi: 3.0.0
info:
  title: ReportET API
  version: 1.1.0
  description: Multi-tenant pharma field-ops API. Employee tokens use `typ: employee`; organization tokens use `typ: org`.
servers:
  - url: http://localhost:5000
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Employee login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ employee; no expiry (mobile long-lived session)
        "401":
          description: Invalid credentials
        "403":
          description: Account deactivated

  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Clear employee token cookie
      responses:
        "200":
          description: Logged out

  /api/orgauth/register:
    post:
      tags: [Org Auth]
      security: []
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, email, password]
              properties:
                organizationName: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Organization created

  /api/orgauth/login:
    post:
      tags: [Org Auth]
      security: []
      summary: Organization login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ org, expires in 7 days

  /api/employee/create:
    post:
      tags: [Employee]
      summary: Onboard an employee
      responses:
        "200":
          description: Employee created

  /api/employee/getAllEmployees:
    post:
      tags: [Employee]
      summary: Paginated employee list
      responses:
        "200":
          description: Employee page

  /api/employee/getAllEmployeeOptions:
    get:
      tags: [Employee]
      summary: Employee dropdown options
      responses:
        "200":
          description: Options

  /api/employee/getAssignedDetails:
    get:
      tags: [Employee]
      summary: Assigned areas and doctors for the logged-in employee
      responses:
        "200":
          description: Areas and doctors scoped to the employee org

  /api/employee/getSuperiors:
    get:
      tags: [Employee]
      summary: Superiors of the logged-in employee
      responses:
        "200":
          description: Superiors

  /api/employee/getSubordinates:
    get:
      tags: [Employee]
      summary: Subordinates of the logged-in employee
      responses:
        "200":
          description: Subordinates

  /api/employee/call-average:
    get:
      tags: [Employee]
      summary: Call average report
      responses:
        "200":
          description: Report

  /api/employee/call-average/export:
    get:
      tags: [Employee]
      summary: Export call average report
      responses:
        "200":
          description: Excel file

  /api/employee/forgot-password:
    post:
      tags: [Employee]
      security: []
      summary: Request a password reset email
      responses:
        "200":
          description: Generic success message

  /api/employee/reset-password/{token}:
    post:
      tags: [Employee]
      security: []
      summary: Reset password with emailed token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password updated

  /api/employee/{employeeId}:
    get:
      tags: [Employee]
      summary: Get employee by id
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee
    patch:
      tags: [Employee]
      summary: Update employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/area/add:
    post:
      tags: [Area]
      summary: Add areas
      responses:
        "201":
          description: Areas inserted

  /api/area:
    post:
      tags: [Area]
      summary: Paginated area list
      responses:
        "200":
          description: Areas

  /api/area/import:
    post:
      tags: [Area]
      summary: Import areas from Excel
      responses:
        "200":
          description: Import result

  /api/area/headquarter/{id}:
    get:
      tags: [Area]
      summary: Areas in a headquarter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Areas

  /api/area/employee:
    post:
      tags: [Area]
      summary: Assigned areas for an employee
      responses:
        "200":
          description: Areas for assigned headquarters

  /api/area/{id}:
    get:
      tags: [Area]
      summary: Get area by id (org-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Area
        "404":
          description: Not found in this organization
    put:
      tags: [Area]
      summary: Edit area
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Area]
      summary: Delete area. Pass force=true to also delete org-scoped doctors.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: force
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Deleted
        "409":
          description: Linked doctors exist

  /api/headQuarter/bulkuiadd:
    post:
      tags: [HeadQuarter]
      summary: Create HQ / area / doctor hierarchy. organizationId is taken from the auth org, not the body.
      responses:
        "200":
          description: Hierarchy created

  /api/headQuarter/getPaginatedHeadQuarters:
    post:
      tags: [HeadQuarter]
      summary: Paginated headquarters
      responses:
        "200":
          description: Headquarters

  /api/headQuarter/getAllHeadQuarterNames:
    get:
      tags: [HeadQuarter]
      summary: Headquarter name options
      responses:
        "200":
          description: Names

  /api/headQuarter/employee:
    post:
      tags: [HeadQuarter]
      summary: Headquarters assigned to the employee
      responses:
        "200":
          description: Headquarters

  /api/headQuarter/import:
    post:
      tags: [HeadQuarter]
      summary: Import headquarters from Excel
      responses:
        "200":
          description: Import result

  /api/headQuarter/unassigned:
    get:
      tags: [HeadQuarter]
      summary: Unassigned hierarchy
      responses:
        "200":
          description: Unassigned nodes

  /api/headQuarter/zones:
    get:
      tags: [HeadQuarter]
      summary: Zone names for the org
      responses:
        "200":
          description: Zones

  /api/headQuarter/{headquarterId}:
    put:
      tags: [HeadQuarter]
      summary: Edit headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [HeadQuarter]
      summary: Delete headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/headQuarter/{headquarterId}/assignments:
    get:
      tags: [HeadQuarter]
      summary: Assignments for a headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assignments

  /api/budget/meta/years:
    get:
      tags: [Budget]
      summary: Configured financial years
      responses:
        "200":
          description: Years

  /api/budget:
    get:
      tags: [Budget]
      summary: All headquarter budgets for a year
      responses:
        "200":
          description: Budgets

  /api/budget/{headQuarterId}:
    get:
      tags: [Budget]
      summary: Budget for one headquarter
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Budget
    put:
      tags: [Budget]
      summary: Set headquarter budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved
    patch:
      tags: [Budget]
      summary: Update monthly budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/zone/getZoneOptions:
    get:
      tags: [Zone]
      summary: Zone options
      responses:
        "200":
          description: Zones

  /api/doctor/add:
    post:
      tags: [Doctor]
      summary: Add doctors
      responses:
        "201":
          description: Created

  /api/doctor/getAll:
    post:
      tags: [Doctor]
      summary: Paginated doctor list
      responses:
        "200":
          description: Doctors

  /api/doctor/getByAreaId/{areaId}:
    get:
      tags: [Doctor]
      summary: Doctors in an area (org-scoped)
      parameters:
        - in: path
          name: areaId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Doctors

  /api/doctor/import:
    post:
      tags: [Doctor]
      summary: Import doctors from Excel
      responses:
        "200":
          description: Import result

  /api/doctor/export:
    post:
      tags: [Doctor]
      summary: Export doctors
      responses:
        "200":
          description: Excel file

  /api/doctor/{doctorId}:
    put:
      tags: [Doctor]
      summary: Edit doctor
      parameters:
        - in: path
          name: doctorId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Doctor]
      summary: Delete doctor
      parameters:
        - in: path
          name: doctorId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/stockists:
    post:
      tags: [Stockist]
      summary: Create stockist
      responses:
        "201":
          description: Created

  /api/stockists/paginatedStockistList:
    post:
      tags: [Stockist]
      summary: Paginated stockists
      responses:
        "200":
          description: Stockists

  /api/stockists/getStockistOptions:
    get:
      tags: [Stockist]
      summary: Stockist options
      responses:
        "200":
          description: Options

  /api/stockists/{id}:
    put:
      tags: [Stockist]
      summary: Update stockist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Stockist]
      summary: Delete stockist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/sales:
    post:
      tags: [Sales]
      summary: Employee create sale (sets saleByModel Employee)
      responses:
        "201":
          description: Created

  /api/sales/getEmployeeSales:
    post:
      tags: [Sales]
      summary: Sales list for the logged-in employee
      responses:
        "200":
          description: Sales

  /api/sales/getAllSales:
    post:
      tags: [Sales]
      summary: Org sales list
      responses:
        "200":
          description: Sales

  /api/sales/exportAllSales:
    post:
      tags: [Sales]
      summary: Export org sales
      responses:
        "200":
          description: Excel file

  /api/sales/alreadySubmitedSales:
    get:
      tags: [Sales]
      summary: Whether the employee already submitted this month
      responses:
        "200":
          description: Submitted flag

  /api/sales/createSaleByAdmin:
    post:
      tags: [Sales]
      summary: Admin create sale
      responses:
        "201":
          description: Created

  /api/sales/alreadySubmitedSalesByAdmin:
    get:
      tags: [Sales]
      summary: Whether admin already submitted this month
      responses:
        "200":
          description: Submitted flag

  /api/sales/headQuarterSales/{headQuarterId}:
    post:
      tags: [Sales]
      summary: Sales for a headquarter (orgAuth required)
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sales
        "401":
          description: Missing organization

  /api/sales/{id}:
    put:
      tags: [Sales]
      summary: Update sale (saleAmount, month, stockist only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Sales]
      summary: Delete sale
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/daily-visit/create:
    post:
      tags: [Daily Visit]
      summary: Create daily visit
      responses:
        "201":
          description: Created

  /api/daily-visit/getVisitList:
    post:
      tags: [Daily Visit]
      summary: Employee visit list
      responses:
        "200":
          description: Visits

  /api/daily-visit/getVisitInfo:
    get:
      tags: [Daily Visit]
      summary: Today's visit submission status
      responses:
        "200":
          description: Status

  /api/daily-visit/getSubordinateVisitReport:
    post:
      tags: [Daily Visit]
      summary: Subordinate visit report
      responses:
        "200":
          description: Report

  /api/daily-visit/getOrganizationVisitList:
    post:
      tags: [Daily Visit]
      summary: Org visit list
      responses:
        "200":
          description: Visits

  /api/daily-visit/exportOrganizationVisitList:
    post:
      tags: [Daily Visit]
      summary: Export org visits
      responses:
        "200":
          description: Excel file

  /api/daily-visit/getDoctorVisitReport:
    get:
      tags: [Daily Visit]
      summary: Doctor visit report
      responses:
        "200":
          description: Report

  /api/daily-visit/exportDoctorVisitReport:
    get:
      tags: [Daily Visit]
      summary: Export doctor visit report
      responses:
        "200":
          description: Excel file

  /api/daily-visit/getDoctorVisitSummary:
    get:
      tags: [Daily Visit]
      summary: Doctor visit summary
      responses:
        "200":
          description: Summary

  /api/daily-visit/workingReporting:
    get:
      tags: [Daily Visit]
      summary: Working vs reporting summary
      responses:
        "200":
          description: Summary

  /api/daily-visit/{id}:
    put:
      tags: [Daily Visit]
      summary: Update visit (whitelisted fields only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Daily Visit]
      summary: Delete visit
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/leaves/apply:
    post:
      tags: [Leave]
      summary: Apply for leave
      responses:
        "201":
          description: Applied

  /api/leaves/my:
    get:
      tags: [Leave]
      summary: Current employee leaves
      responses:
        "200":
          description: Leaves

  /api/leaves/team:
    post:
      tags: [Leave]
      summary: Team leaves (areaManager or zonalManager only)
      responses:
        "200":
          description: Leaves
        "403":
          description: Insufficient role

  /api/leaves/{leaveId}/action/manager:
    patch:
      tags: [Leave]
      summary: Approve or reject leave as manager
      parameters:
        - in: path
          name: leaveId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Actioned
        "403":
          description: Insufficient role

  /api/leaves/all:
    post:
      tags: [Leave]
      summary: All org leaves (admin)
      responses:
        "200":
          description: Leaves

  /api/leaves/{leaveId}/action/admin:
    patch:
      tags: [Leave]
      summary: Approve or reject leave as admin
      parameters:
        - in: path
          name: leaveId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Actioned

  /api/leaves/getLeaveSummary:
    get:
      tags: [Leave]
      summary: Leave summary
      responses:
        "200":
          description: Summary

  /api/logo/branding:
    put:
      tags: [Branding]
      summary: Update brand name or logo. Response never includes password.
      responses:
        "200":
          description: Branding fields only

  /api/logo/me:
    get:
      tags: [Branding]
      summary: Current organization (no password)
      responses:
        "200":
          description: Org profile

  /api/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications

  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark all as read
      responses:
        "200":
          description: Updated

  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/notifications/{id}:
    delete:
      tags: [Notifications]
      summary: Delete notification
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/notifications/settings:
    get:
      tags: [Notifications]
      summary: Notification settings
      responses:
        "200":
          description: Settings

  /api/notifications/settings/toggle:
    patch:
      tags: [Notifications]
      summary: Toggle notification feature
      responses:
        "200":
          description: Updated

  /api/notifications/settings/{eventType}:
    put:
      tags: [Notifications]
      summary: Update event setting
      parameters:
        - in: path
          name: eventType
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/notifications/logo:
    post:
      tags: [Notifications]
      summary: Upload event logo
      responses:
        "200":
          description: Uploaded

  /api/notifications/doctors/{doctorId}/birthday-greeting:
    post:
      tags: [Notifications]
      summary: Send doctor birthday greeting
      parameters:
        - in: path
          name: doctorId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sent
