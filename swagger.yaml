  /api/budget/meta/years:
    get:
      tags: [Budget]
      summary: Configured financial years
      responses:
        "200":
          description: Years

  /api/budget:
    get:
      tags: [Budget]
      summary: All headquarter budgets for a year
      responses:
        "200":
          description: Budgets

  /api/budget/{headQuarterId}:
    get:
      tags: [Budget]
      summary: Budget for one headquarter
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
