    put:
      tags: [Budget]
      summary: Set headquarter budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved
    patch:
      tags: [Budget]
      summary: Update monthly budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/zone/getZoneOptions:
    get:
      tags: [Zone]
      summary: Zone options
      responses:
        "200":
          description: Zones

  /api/doctor/add:
    post:
      tags: [Doctor]
      summary: Add doctors
      responses:
        "201":
          description: Created

  /api/doctor/getAll:
    post:
      tags: [Doctor]
