  /api/leaves/types:
    get:
      tags: [Leave]
      summary: Leave types master list
      description: |
        Employee or org admin token.
        Returns organization leave types for Apply dropdown / master.
        By default only active types. Pass includeInactive=true to include inactive (admin UI).
      parameters:
        - in: query
          name: includeInactive
          schema: { type: string, enum: ["true", "false"] }
          description: When true, returns inactive types as well
      responses:
        "200":
          description: Leave types
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  leaveTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveType"
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch leave types
    post:
      tags: [Leave]
      summary: Create leave type (admin / orgToken)
      description: |
        Org admin token only.
        Creates a leave type and seeds EmployeeLeaveBalance = annualQuota for all active employees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, annualQuota, paid]
              properties:
                name: { type: string, example: Casual Leave }
                code: { type: string, example: CL }
                annualQuota: { type: number, example: 12 }
                paid: { type: boolean, example: true }
                creditWindow:
                  type: string
                  enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
                  default: YEARLY
                creditAmount:
                  type: number
                  description: Defaults to annualQuota
                carryForward: { type: boolean, default: false }
                maxCarryForward: { type: number, default: 0 }
                active: { type: boolean, default: true }
      responses:
        "201":
          description: Leave type created and balances seeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  leaveType:
                    $ref: "#/components/schemas/LeaveType"
        "409":
          description: Duplicate leave type name
        "422":
          description: Validation error
        "500":
          description: Failed to create leave type

  /api/leaves/types/{id}:
    put:
      tags: [Leave]
      summary: Update leave type (admin / orgToken)
      description: |
        Org admin token only.
        If annualQuota changes, employee balances are adjusted by the delta (floored at 0).
        Reactivating a type re-seeds missing employee balances.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: LeaveType ObjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                code: { type: string }
                annualQuota: { type: number }
                paid: { type: boolean }
                creditWindow:
                  type: string
                  enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
                creditAmount: { type: number }
                carryForward: { type: boolean }
                maxCarryForward: { type: number }
                active: { type: boolean }
      responses:
        "200":
          description: Leave type updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  leaveType:
                    $ref: "#/components/schemas/LeaveType"
        "400":
          description: Invalid leave type ID
        "404":
          description: Leave type not found
        "409":
          description: Duplicate leave type name
        "422":
          description: Validation error
        "500":
          description: Failed to update leave type

  /api/leaves/balance:
    get:
      tags: [Leave]
      summary: Current employee leave balance cards
      description: |
        Employee token only.
        One card per active leave type with remaining balance, used (approved) count, and annualQuota.
        Uses EmployeeLeaveBalance when present; otherwise falls back to annualQuota - approved leaves.
      responses:
        "200":
          description: Balance cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        leaveType:
                          $ref: "#/components/schemas/LeaveType"
                        balance: { type: number }
                        used: { type: number }
                        annualQuota: { type: number }
        "401":
          description: Unauthorized
        "500":
          description: Failed to fetch leave balance

  /api/leaves/apply:
    post:
      tags: [Leave]
      summary: Apply for leave (employee token)
      description: |
        Creates a leave request for the authenticated employee using a single leaveDate.
        Requires an active leave type and available balance (balance - pending >= 1).
        Balance is not reduced until the leave is approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveType, date, reason]
              properties:
                leaveType:
                  type: string
                  description: LeaveType ObjectId
                date:
                  type: string
                  format: date
                  description: Leave date (maps to leaveDate)
                reason:
                  type: string
      responses:
        "201":
          description: Leave applied successfully
        "422":
          description: Missing fields, inactive type, or insufficient leave balance
        "500":
          description: Failed to apply leave

