openapi: 3.0.0
info:
  title: ReportET API
  version: 1.1.0
  description: Multi-tenant pharma field-ops API. Employee tokens use `typ: employee`; organization tokens use `typ: org`.
servers:
  - url: http://localhost:5000
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    LeaveType:
      type: object
      properties:
        _id: { type: string }
        organizationId: { type: string }
        name: { type: string, example: Casual Leave }
        code: { type: string, example: CL }
        annualQuota: { type: number, example: 12 }
        paid: { type: boolean }
        creditWindow:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
        creditAmount: { type: number }
        carryForward: { type: boolean }
        maxCarryForward: { type: number }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Leave:
      type: object
      properties:
        _id: { type: string }
        employeeId:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                employeeId: { type: string }
                role:
                  type: string
                  enum: [mr, areaManager, zonalManager]
        organizationId: { type: string }
        leaveType:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                name: { type: string }
                code: { type: string }
                paid: { type: boolean }
        leaveDate: { type: string, format: date-time }
        reason: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedBy: { type: string, nullable: true }
        approvedByRole:
          type: string
          nullable: true
          enum: [areaManager, zonalManager, admin]
        actionAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
    PromotionHistory:
      type: object
      properties:
        _id: { type: string }
        employeeId: { type: string }
        organizationId: { type: string }
        fromRole:
          type: string
          enum: [mr, areaManager, zonalManager]
        toRole:
          type: string
          enum: [mr, areaManager, zonalManager]
        fromHeadQuarters:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  _id: { type: string }
                  headQuarterName: { type: string }
        toHeadQuarters:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  _id: { type: string }
                  headQuarterName: { type: string }
        fromZones:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  _id: { type: string }
                  name: { type: string }
        toZones:
          type: array
          items:
            oneOf:
              - type: string
              - type: object
                properties:
                  _id: { type: string }
                  name: { type: string }
        promotedByKind:
          type: string
          enum: [admin, employee]
        promotedBy: { type: string }
        promotedByRole:
          type: string
          enum: [admin, zonalManager]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeaveBreakdownEntry:
      type: object
      properties:
        code: { type: string, example: CL }
        name: { type: string, example: Casual Leave }
        days: { type: integer, example: 2 }
    LeaveReportRow:
      type: object
      properties:
        employeeId: { type: string, example: emp-001 }
        employeeName: { type: string, example: Rahul Sharma }
        managerName: { type: string, nullable: true, example: Priya Mehta }
        role:
          type: string
          enum: [mr, areaManager, zonalManager]
        totalLeaves: { type: integer, example: 5 }
        leaveBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/LeaveBreakdownEntry"
    TrackingPingPoint:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, example: 19.1197 }
        longitude: { type: number, example: 72.8468 }
        accuracy: { type: number }
        speed: { type: number, description: meters per second }
        heading: { type: number }
        battery: { type: number }
        activity:
          type: string
          enum: [still, walking, driving, unknown]
        timestamp: { type: string, format: date-time }
    TrackingTimelineItem:
      type: object
      properties:
        type:
          type: string
          enum: [started, segment, completed]
        activity:
          type: string
          nullable: true
          enum: [still, walking, driving, unknown, null]
        title: { type: string }
        placeName: { type: string, nullable: true }
        startTime: { type: string, format: date-time, nullable: true }
        endTime: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        meta: { type: object }
    TrackingTripAnalysis:
      type: object
      properties:
        employee:
          type: object
          properties:
            id: { type: string }
            employeeId: { type: string }
            name: { type: string }
        date: { type: string }
        trip:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [active, completed] }
            totalDistanceMeters: { type: number }
            durationSeconds: { type: integer }
            startTime: { type: string, format: date-time }
            endTime: { type: string, format: date-time }
        path:
          type: array
          items:
            type: object
            properties:
              lat: { type: number }
              lng: { type: number }
              timestamp: { type: string, format: date-time }
              activity: { type: string }
              speed: { type: number, nullable: true }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TrackingTimelineItem"
        markers:
          type: object
          properties:
            start: { type: object }
            end: { type: object }
            stops:
              type: array
              items: { type: object }
    TourPlanDayPlan:
      type: object
      description: One tour entry per working day (areaIds + doctorIds only).
      properties:
        date: { type: string, example: "2024-10-18" }
        areaIds:
          type: array
          items: { type: string }
        doctorIds:
          type: array
          items: { type: string }
    TourPlanCalendarDay:
      type: object
      properties:
        date: { type: string, example: "2024-10-18" }
        dayOfMonth: { type: integer, example: 18 }
        dayOfWeek: { type: integer, description: "0=Sunday … 6=Saturday", example: 5 }
        isSelectable: { type: boolean }
        isWeeklyOff: { type: boolean }
        isHoliday: { type: boolean }
        holidayName: { type: string, nullable: true }
        planStatus:
          type: string
          nullable: true
          enum: [planned, unplanned, null]
    TourPlanMonthView:
      type: object
      properties:
        year: { type: integer, example: 2024 }
        month: { type: integer, example: 10 }
        status:
          type: string
          enum: [draft, submitted, approved, rejected]
        canEdit: { type: boolean }
        submittedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        summary:
          type: object
          properties:
            totalWorkingDays: { type: integer, example: 22 }
            plannedDaysCount: { type: integer, example: 18 }
        calendar:
          type: object
          properties:
            days:
              type: array
              items:
                $ref: "#/components/schemas/TourPlanCalendarDay"
        selectedDate: { type: string, nullable: true, example: "2024-10-18" }
        dayPlans:
          type: object
          description: All planned days keyed by YYYY-MM-DD (use for date taps — no separate day-load API).
          additionalProperties:
            $ref: "#/components/schemas/TourPlanDayPlan"
        dayPlan:
          description: Convenience mirror of dayPlans[selectedDate].
          oneOf:
            - $ref: "#/components/schemas/TourPlanDayPlan"
            - type: "null"

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Employee login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ employee; no expiry (mobile long-lived session)
        "401":
          description: Invalid credentials
        "403":
          description: Account deactivated

  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Clear employee token cookie
      responses:
        "200":
          description: Logged out

  /api/orgauth/register:
    post:
      tags: [Org Auth]
      security: []
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, email, password]
              properties:
                organizationName: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Organization created

  /api/orgauth/login:
    post:
      tags: [Org Auth]
      security: []
      summary: Organization login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ org, expires in 7 days

  /api/orgauth/logout:
    post:
      tags: [Org Auth]
      security: []
      summary: Clear organization orgToken cookie
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Logout successful }

  /api/employee/profile:
    get:
      tags: [Employee]
      summary: Logged-in employee profile
      description: |
        Employee Bearer token.
        Returns profile (with assigned HQs), immediate manager (or null),
        direct reportees (name, employeeId, headquarters), and assigned doctors.
        Direct reportees: AM → MR, ZM → AM, MR → none. Matched by HQ subset.
        HQ city/state are parsed from HeadQuarter.location when formatted as "City, State".
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  profile:
                    type: object
                    properties:
                      _id: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      employeeId: { type: string }
                      role:
                        type: string
                        enum: [mr, areaManager, zonalManager]
                      phone: { type: string, nullable: true }
                      email: { type: string }
                      assignedHeadQuarters:
                        type: array
                        items:
                          type: object
                          properties:
                            _id: { type: string }
                            headQuarterName: { type: string }
                            city: { type: string, nullable: true }
                            state: { type: string, nullable: true }
                  manager:
                    nullable: true
                    type: object
                    properties:
                      _id: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      employeeId: { type: string }
                      role: { type: string }
                      phone: { type: string, nullable: true }
                      email: { type: string }
                      headQuarterName: { type: string, nullable: true }
                  reportees:
                    type: array
                    description: Direct reports. Empty for MR.
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        employeeId: { type: string }
                        role:
                          type: string
                          enum: [mr, areaManager]
                        assignedHeadQuarters:
                          type: array
                          items:
                            type: object
                            properties:
                              _id: { type: string }
                              headQuarterName: { type: string }
                              city: { type: string, nullable: true }
                              state: { type: string, nullable: true }
                  doctors:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        specialty: { type: string, nullable: true }
                        headQuarterId: { type: string, nullable: true }
                        headQuarterName: { type: string, nullable: true }
                        areaId: { type: string, nullable: true }
                        areaName: { type: string, nullable: true }
        "401":
          description: Unauthorized
        "404":
          description: Employee not found
        "500":
          description: Failed to fetch profile

  /api/employee/create:
    post:
      tags: [Employee]
      summary: Onboard an employee
      responses:
        "200":
          description: Employee created

  /api/employee/getAllEmployees:
    post:
      tags: [Employee]
      summary: Paginated employee list
      responses:
        "200":
          description: Employee page

  /api/employee/getAllEmployeeOptions:
    get:
      tags: [Employee]
      summary: Employee dropdown options
      responses:
        "200":
          description: Options

  /api/employee/getAssignedDetails:
    get:
      tags: [Employee]
      summary: Assigned areas and doctors for the logged-in employee
      responses:
        "200":
          description: Areas and doctors scoped to the employee org

  /api/employee/getSuperiors:
    get:
      tags: [Employee]
      summary: Superiors of the logged-in employee
      responses:
        "200":
          description: Superiors

  /api/employee/getSubordinates:
    get:
      tags: [Employee]
      summary: Subordinates of the logged-in employee
      responses:
        "200":
          description: Subordinates

  /api/employee/call-average:
    get:
      tags: [Employee]
      summary: Call average report
      responses:
        "200":
          description: Report

  /api/employee/call-average/export:
    get:
      tags: [Employee]
      summary: Export call average report
      responses:
        "200":
          description: Excel file

  /api/employee/forgot-password:
    post:
      tags: [Employee]
      security: []
      summary: Request a password reset email
      responses:
        "200":
          description: Generic success message

  /api/employee/reset-password/{token}:
    post:
      tags: [Employee]
      security: []
      summary: Reset password with emailed token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password updated

  /api/employee/{employeeId}/promote:
    post:
      tags: [Employee]
      summary: Promote an employee (immediate)
      description: |
        One-step promotion only: `mr` → `areaManager`, or `areaManager` → `zonalManager`.

        **Auth**
        - Organization admin (`orgToken` / org JWT): both transitions.
        - Zonal manager (employee JWT): only `mr` → `areaManager`, and only when the MR's
          current HQs and the final HQs are inside that ZM's assigned headquarters.

        **MR → Area Manager territory**
        - `assignedHeadQuarters`: replace with this final HQ list, or
        - `addHeadQuarters`: keep current HQs and add these, or
        - omit both: keep current HQs only.
        Do not send both `assignedHeadQuarters` and `addHeadQuarters`.
        Rejects if any final HQ is already assigned to another active area manager.

        **AM → Zonal Manager territory**
        - Requires `assignedZones` (admin only).
        - System derives and stores all headquarters under those zones (same as onboard).

        Writes a PromotionHistory row (from/to role + territories + actor).
        When leaving MR, disables live tracking and completes any active tracking session.
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toRole]
              properties:
                toRole:
                  type: string
                  enum: [areaManager, zonalManager]
                assignedHeadQuarters:
                  type: array
                  items: { type: string }
                  description: Final HQ list for MR → AM (replace mode)
                addHeadQuarters:
                  type: array
                  items: { type: string }
                  description: Extra HQs for MR → AM (keep current + add)
                assignedZones:
                  type: array
                  items: { type: string }
                  description: Required for AM → ZM
            examples:
              mrToAmReplace:
                summary: MR → AM with fully new HQ list
                value:
                  toRole: areaManager
                  assignedHeadQuarters: ["64f1hq000000000000000001", "64f1hq000000000000000002"]
              mrToAmKeepAndAdd:
                summary: MR → AM keep current HQ and add more
                value:
                  toRole: areaManager
                  addHeadQuarters: ["64f1hq000000000000000002"]
              amToZm:
                summary: AM → ZM (admin only)
                value:
                  toRole: zonalManager
                  assignedZones: ["64f1zone0000000000000001"]
      responses:
        "200":
          description: Employee promoted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  employee: { type: object }
                  promotion:
                    $ref: "#/components/schemas/PromotionHistory"
        "400":
          description: Invalid employee ID
        "401":
          description: Unauthorized
        "403":
          description: Actor not allowed for this promotion
        "404":
          description: Employee not found
        "422":
          description: Validation failed (step, territory, or HQ already on another AM)
        "500":
          description: Failed to promote employee

  /api/employee/{employeeId}/promotions:
    get:
      tags: [Employee]
      summary: Promotion history for an employee
      description: |
        Returns append-only promotion records for the employee (newest first).
        Organization admin or zonal manager (same org).
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Promotion timeline
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  promotions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PromotionHistory"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Employee not found
        "500":
          description: Failed to fetch promotions

  /api/employee/{employeeId}:
    get:
      tags: [Employee]
      summary: Get employee by id
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee
    patch:
      tags: [Employee]
      summary: Update employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/area/add:
    post:
      tags: [Area]
      summary: Add areas
      responses:
        "201":
          description: Areas inserted

  /api/area:
    post:
      tags: [Area]
      summary: Paginated area list
      responses:
        "200":
          description: Areas

  /api/area/import:
    post:
      tags: [Area]
      summary: Import areas from Excel
      responses:
        "200":
          description: Import result

  /api/area/headquarter/{id}:
    get:
      tags: [Area]
      summary: Areas in a headquarter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Areas

  /api/area/employee:
    post:
      tags: [Area]
      summary: Assigned areas for an employee
      responses:
        "200":
          description: Areas for assigned headquarters

  /api/area/{id}:
    get:
      tags: [Area]
      summary: Get area by id (org-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Area
        "404":
          description: Not found in this organization
    put:
      tags: [Area]
      summary: Edit area
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Area]
      summary: Delete area. Pass force=true to also delete org-scoped doctors.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: force
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Deleted
        "409":
          description: Linked doctors exist

  /api/headQuarter/bulkuiadd:
    post:
      tags: [HeadQuarter]
      summary: Create HQ / area / doctor hierarchy. organizationId is taken from the auth org, not the body.
      responses:
        "200":
          description: Hierarchy created

  /api/headQuarter/getPaginatedHeadQuarters:
    post:
      tags: [HeadQuarter]
      summary: Paginated headquarters
      responses:
        "200":
          description: Headquarters

  /api/headQuarter/getAllHeadQuarterNames:
    get:
      tags: [HeadQuarter]
      summary: Headquarter name options
      responses:
        "200":
          description: Names

  /api/headQuarter/employee:
    post:
      tags: [HeadQuarter]
      summary: Headquarters assigned to the employee
      responses:
        "200":
          description: Headquarters

  /api/headQuarter/import:
    post:
      tags: [HeadQuarter]
      summary: Import headquarters from Excel
      responses:
        "200":
          description: Import result

  /api/headQuarter/unassigned:
    get:
      tags: [HeadQuarter]
      summary: Unassigned hierarchy
      responses:
        "200":
          description: Unassigned nodes

  /api/headQuarter/zones:
    get:
      tags: [HeadQuarter]
      summary: Zone names for the org
      responses:
        "200":
          description: Zones

  /api/headQuarter/{headquarterId}:
    put:
      tags: [HeadQuarter]
      summary: Edit headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [HeadQuarter]
      summary: Delete headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/headQuarter/{headquarterId}/assignments:
    get:
      tags: [HeadQuarter]
      summary: Assignments for a headquarter
      parameters:
        - in: path
          name: headquarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Assignments

  /api/budget/meta/years:
    get:
      tags: [Budget]
      summary: Configured financial years
      responses:
        "200":
          description: Years

  /api/budget:
    get:
      tags: [Budget]
      summary: All headquarter budgets for a year
      responses:
        "200":
          description: Budgets

  /api/budget/{headQuarterId}:
    get:
      tags: [Budget]
      summary: Budget for one headquarter
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Budget
    put:
      tags: [Budget]
      summary: Set headquarter budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved
    patch:
      tags: [Budget]
      summary: Update monthly budget
      parameters:
        - in: path
          name: headQuarterId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/zone/getZoneOptions:
    get:
      tags: [Zone]
      summary: Zone options
      responses:
        "200":
          description: Zones

  /api/doctor/add:
    post:
      tags: [Doctor]
      summary: Add doctors
      responses:
        "201":
          description: Created

  /api/doctor/getAll:
    post:
      tags: [Doctor]
      summary: Paginated doctor list
      responses:
        "200":
          description: Doctors

  /api/doctor/getByAreaId/{areaId}:
