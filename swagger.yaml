      tags: [Doctor]
      summary: Doctors in an area (org-scoped)
      parameters:
        - in: path
          name: areaId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Doctors

  /api/doctor/import:
    post:
      tags: [Doctor]
      summary: Import doctors from Excel
      responses:
        "200":
          description: Import result

  /api/doctor/export:
    post:
      tags: [Doctor]
      summary: Export doctors
      responses:
        "200":
          description: Excel file

  /api/doctor/{doctorId}:
    put:
      tags: [Doctor]
      summary: Edit doctor
      parameters:
        - in: path
          name: doctorId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Doctor]
      summary: Delete doctor
      parameters:
        - in: path
          name: doctorId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/stockists:
    post:
      tags: [Stockist]
      summary: Create stockist
      responses:
        "201":
          description: Created

  /api/stockists/paginatedStockistList:
    post:
      tags: [Stockist]
      summary: Paginated stockists
      responses:
        "200":
          description: Stockists

  /api/stockists/getStockistOptions:
    get:
      tags: [Stockist]
      summary: Stockist options
      responses:
        "200":
          description: Options

  /api/stockists/{id}:
    put:
      tags: [Stockist]
      summary: Update stockist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Stockist]
      summary: Delete stockist
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/sales:
    post:
      tags: [Sales]
      summary: Employee create sale (sets saleByModel Employee)
      responses:
        "201":
          description: Created

  /api/sales/getEmployeeSales:
    post:
      tags: [Sales]
      summary: Sales list for the logged-in employee
      responses:
        "200":
          description: Sales

  /api/sales/getAllSales:
    post:
      tags: [Sales]
      summary: Org sales list
      responses:
        "200":
          description: Sales

  /api/sales/exportAllSales:
    post:
      tags: [Sales]
      summary: Export org sales
