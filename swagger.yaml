  /api/leaves/subordinates:
    get:
      tags: [Leave]
      summary: Subordinate leaves split into direct and other reports
      description: |
        Employee (AM/ZM) or org admin token.
        Direct vs other:
        - areaManager → direct: MR, other: none
        - zonalManager → direct: AM, other: MR
        - admin → direct: ZM, other: AM + MR
        Scope uses HQ subset (same subordinate matching as getSubordinates).
      parameters:
        - in: query
          name: status
