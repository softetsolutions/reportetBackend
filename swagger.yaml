  /api/leaves/getLeaveSummary:
    get:
      tags: [Leave]
      summary: Monthly leave dashboard summary (admin)
      description: |
        Organization (admin) token only.
        Returns 12 months of leave request counts for the selected calendar year (IST),
        broken down by status (approved/pending/rejected) and leave type.
        Also returns `onLeaveToday` — count of approved leaves whose leaveDate is today (IST).
      parameters:
        - in: query
          name: year
          schema:
            type: integer
            example: 2026
          description: Calendar year (defaults to current IST year)
      responses:
        "200":
          description: Leave summary for dashboard chart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  year: { type: integer, example: 2026 }
                  onLeaveToday: { type: integer, example: 2 }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string, example: Jan }
                        monthNumber: { type: integer, example: 1 }
                        approved: { type: integer }
                        pending: { type: integer }
                        rejected: { type: integer }
                        leaveTotal: { type: integer }
                        leaveTypes:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              code: { type: string }
                              count: { type: integer }
        "400":
          description: Invalid year
        "401":
          description: Not authenticated
        "500":
          description: Failed to fetch leave summary

  /api/leaves/getLeaveReport:
    get:
      tags: [Leave]
      summary: Paginated employee leave report (admin)
      description: |
        Organization (admin) token only.
        Returns active employees with approved leave day totals for the selected calendar month/year.
        `totalLeaves` is the sum of `leaveBreakdown[].days`.
        `managerName` uses the same direct-manager rules as employee profile (MR→AM, AM→ZM, ZM→null).
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            example: 2026
        - in: query
          name: employeeName
          schema: { type: string }
          description: Partial match on first/last name
        - in: query
          name: role
          schema:
            type: string
            enum: [mr, areaManager, zonalManager]
        - in: query
          name: pageNo
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Leave report page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: Leave report fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaveReportRow"
                  pagination:
                    type: object
                    properties:
                      total: { type: integer, example: 25 }
                      pageNo: { type: integer, example: 1 }
                      limit: { type: integer, example: 10 }
                      totalPages: { type: integer, example: 3 }
        "400":
          description: Invalid month, year, or role
        "401":
          description: Not authenticated
        "500":
          description: Failed to fetch leave report

  /api/leaves/exportLeaveReport:
    get:
      tags: [Leave]
      summary: Export employee leave report as Excel (admin)
      description: |
        Organization (admin) token only.
        Same filters as getLeaveReport (no pagination). Returns an `.xlsx` file with
        one column per active leave type code plus total leaves.
      parameters:
        - in: query
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
        - in: query
          name: year
          required: true
          schema:
            type: integer
            example: 2026
        - in: query
          name: employeeName
          schema: { type: string }
        - in: query
          name: role
          schema:
            type: string
            enum: [mr, areaManager, zonalManager]
      responses:
        "200":
          description: Excel file
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid month, year, or role
        "401":
          description: Not authenticated
        "500":
          description: Failed to export leave report

  /api/leaves/{id}/action:
    post:
      tags: [Leave]
      summary: Approve or reject a subordinate leave
      description: |
        Employee (AM/ZM) or org admin token.
        Approval chain:
        - AM can action MR
        - ZM can action AM and MR
        - Admin can action ZM, AM, and MR
        Applicant must be in actor HQ/org scope. Only pending leaves can be actioned.
        On approve: employee leave balance for that type is decremented by 1.
        On reject: balance is unchanged.
        Approve fails with 409 if balance is insufficient.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: Leave ObjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approved, rejected]
                rejectionReason:
                  type: string
                  description: Required when action is rejected
      responses:
        "200":
          description: Leave actioned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  leave:
                    $ref: "#/components/schemas/Leave"
        "400":
          description: Invalid leave ID
        "403":
          description: Not authorized for this leave
        "404":
          description: Leave not found
        "409":
          description: Leave already approved or rejected
        "422":
          description: Invalid action or missing rejectionReason
        "500":
          description: Failed to action leave

