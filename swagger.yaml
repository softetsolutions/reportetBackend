openapi: 3.0.0
info:
  title: ReportET API
  version: 1.1.0
  description: Multi-tenant pharma field-ops API. Employee tokens use `typ: employee`; organization tokens use `typ: org`.
servers:
  - url: http://localhost:5000
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
    LeaveType:
      type: object
      properties:
        _id: { type: string }
        organizationId: { type: string }
        name: { type: string, example: Casual Leave }
        code: { type: string, example: CL }
        annualQuota: { type: number, example: 12 }
        paid: { type: boolean }
        creditWindow:
          type: string
          enum: [MONTHLY, QUARTERLY, HALF_YEARLY, YEARLY]
        creditAmount: { type: number }
        carryForward: { type: boolean }
        maxCarryForward: { type: number }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Leave:
      type: object
      properties:
        _id: { type: string }
        employeeId:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                employeeId: { type: string }
                role:
                  type: string
                  enum: [mr, areaManager, zonalManager]
        organizationId: { type: string }
        leaveType:
          oneOf:
            - type: string
            - type: object
              properties:
                _id: { type: string }
                name: { type: string }
                code: { type: string }
                paid: { type: boolean }
        leaveDate: { type: string, format: date-time }
        reason: { type: string }
        status:
          type: string
          enum: [pending, approved, rejected]
        approvedBy: { type: string, nullable: true }
        approvedByRole:
          type: string
          nullable: true
          enum: [areaManager, zonalManager, admin]
        actionAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeaveBreakdownEntry:
      type: object
      properties:
        code: { type: string, example: CL }
        name: { type: string, example: Casual Leave }
        days: { type: integer, example: 2 }
    LeaveReportRow:
      type: object
      properties:
        employeeId: { type: string, example: emp-001 }
        employeeName: { type: string, example: Rahul Sharma }
        managerName: { type: string, nullable: true, example: Priya Mehta }
        role:
          type: string
          enum: [mr, areaManager, zonalManager]
        totalLeaves: { type: integer, example: 5 }
        leaveBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/LeaveBreakdownEntry"

security:
  - bearerAuth: []

paths:
  /ping:
    get:
      tags: [Health]
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Server is up

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Employee login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ employee; no expiry (mobile long-lived session)
        "401":
          description: Invalid credentials
        "403":
          description: Account deactivated

  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Clear employee token cookie
      responses:
        "200":
          description: Logged out

  /api/orgauth/register:
    post:
      tags: [Org Auth]
      security: []
      summary: Register an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationName, email, password]
              properties:
                organizationName: { type: string }
                email: { type: string }
                password: { type: string }
      responses:
        "201":
          description: Organization created

  /api/orgauth/login:
    post:
      tags: [Org Auth]
      security: []
      summary: Organization login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: JWT with typ org, expires in 7 days

  /api/employee/profile:
    get:
      tags: [Employee]
      summary: Logged-in employee profile
      description: |
        Employee Bearer token.
        Returns profile (with assigned HQs), immediate manager (or null),
        direct reportees (name, employeeId, headquarters), and assigned doctors.
        Direct reportees: AM → MR, ZM → AM, MR → none. Matched by HQ subset.
        HQ city/state are parsed from HeadQuarter.location when formatted as "City, State".
      responses:
        "200":
          description: Profile payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  profile:
                    type: object
                    properties:
                      _id: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      employeeId: { type: string }
                      role:
                        type: string
                        enum: [mr, areaManager, zonalManager]
                      phone: { type: string, nullable: true }
                      email: { type: string }
                      assignedHeadQuarters:
                        type: array
                        items:
                          type: object
                          properties:
                            _id: { type: string }
                            headQuarterName: { type: string }
                            city: { type: string, nullable: true }
                            state: { type: string, nullable: true }
                  manager:
                    nullable: true
                    type: object
                    properties:
                      _id: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      employeeId: { type: string }
                      role: { type: string }
                      phone: { type: string, nullable: true }
                      email: { type: string }
                      headQuarterName: { type: string, nullable: true }
                  reportees:
                    type: array
                    description: Direct reports. Empty for MR.
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        firstName: { type: string }
                        lastName: { type: string }
                        employeeId: { type: string }
                        role:
                          type: string
                          enum: [mr, areaManager]
                        assignedHeadQuarters:
                          type: array
                          items:
                            type: object
                            properties:
                              _id: { type: string }
                              headQuarterName: { type: string }
                              city: { type: string, nullable: true }
                              state: { type: string, nullable: true }
                  doctors:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        name: { type: string }
                        specialty: { type: string, nullable: true }
                        headQuarterId: { type: string, nullable: true }
                        headQuarterName: { type: string, nullable: true }
                        areaId: { type: string, nullable: true }
                        areaName: { type: string, nullable: true }
        "401":
          description: Unauthorized
        "404":
          description: Employee not found
        "500":
          description: Failed to fetch profile

  /api/employee/create:
    post:
      tags: [Employee]
      summary: Onboard an employee
      responses:
        "200":
          description: Employee created

  /api/employee/getAllEmployees:
    post:
      tags: [Employee]
      summary: Paginated employee list
      responses:
        "200":
          description: Employee page

  /api/employee/getAllEmployeeOptions:
    get:
      tags: [Employee]
      summary: Employee dropdown options
      responses:
        "200":
          description: Options

  /api/employee/getAssignedDetails:
    get:
      tags: [Employee]
      summary: Assigned areas and doctors for the logged-in employee
      responses:
        "200":
          description: Areas and doctors scoped to the employee org

  /api/employee/getSuperiors:
    get:
      tags: [Employee]
      summary: Superiors of the logged-in employee
      responses:
        "200":
          description: Superiors

  /api/employee/getSubordinates:
    get:
      tags: [Employee]
      summary: Subordinates of the logged-in employee
      responses:
        "200":
          description: Subordinates

  /api/employee/call-average:
    get:
      tags: [Employee]
      summary: Call average report
      responses:
        "200":
          description: Report

  /api/employee/call-average/export:
    get:
      tags: [Employee]
      summary: Export call average report
      responses:
        "200":
          description: Excel file

  /api/employee/forgot-password:
    post:
      tags: [Employee]
      security: []
      summary: Request a password reset email
      responses:
        "200":
          description: Generic success message

  /api/employee/reset-password/{token}:
    post:
      tags: [Employee]
      security: []
      summary: Reset password with emailed token
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Password updated

  /api/employee/{employeeId}:
    get:
      tags: [Employee]
      summary: Get employee by id
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Employee
    patch:
      tags: [Employee]
      summary: Update employee
      parameters:
        - in: path
          name: employeeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated

  /api/area/add:
    post:
      tags: [Area]
      summary: Add areas
      responses:
        "201":
          description: Areas inserted

  /api/area:
    post:
      tags: [Area]
      summary: Paginated area list
      responses:
        "200":
          description: Areas

  /api/area/import:
    post:
      tags: [Area]
      summary: Import areas from Excel
      responses:
        "200":
          description: Import result

  /api/area/headquarter/{id}:
    get:
      tags: [Area]
      summary: Areas in a headquarter
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Areas

  /api/area/employee:
    post:
      tags: [Area]
      summary: Assigned areas for an employee
      responses:
        "200":
          description: Areas for assigned headquarters

  /api/area/{id}:
    get:
      tags: [Area]
      summary: Get area by id (org-scoped)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Area
        "404":
          description: Not found in this organization
    put:
      tags: [Area]
      summary: Edit area
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated
    delete:
      tags: [Area]
      summary: Delete area. Pass force=true to also delete org-scoped doctors.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: force
          schema: { type: string, enum: ["true"] }
      responses:
        "200":
          description: Deleted
        "409":
          description: Linked doctors exist

  /api/headQuarter/bulkuiadd:
    post:
      tags: [HeadQuarter]
      summary: Create HQ / area / doctor hierarchy. organizationId is taken from the auth org, not the body.
      responses:
        "200":
          description: Hierarchy created

  /api/headQuarter/getPaginatedHeadQuarters:
    post:
      tags: [HeadQuarter]
      summary: Paginated headquarters
      responses:
        "200":
